name: "Maintenance: Watchdog"
# Periodically poll the latest run of each watched workflow; if it
# finished in 'failure' and hasn't already burned through the retry
# budget, kick off rerun-failed-jobs. Catches transient network
# breakage during apt/git/rsync/docker-pull steps that would
# otherwise need manual intervention.
#
# Same shape as armbian/docker-armbian-build's maintenance-watchdog.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read

concurrency:
  group: watchdog-${{ github.ref }}
  cancel-in-progress: true

jobs:

  watchdog:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # Workflows to retry. Bare filename (without .yml).
        script:
          - action
          - infrastructure-dispatch-download-index

    name: "${{ matrix.script }}"
    runs-on: ubuntu-24.04
    permissions:
      # Required for rerun-failed-jobs API:
      # POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs
      actions: write
    if: ${{ github.repository_owner == 'Armbian' }}
    steps:

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: "Restart ${{ matrix.script }}.yml"
        run: |
          set -euo pipefail

          ATTEMPTS="3"
          SCRIPT="${{ matrix.script }}"

          # Resolve workflow id from its path.
          WORKFLOW=$(gh api "/repos/${{ github.repository }}/actions/workflows" \
            | jq -r --arg path ".github/workflows/${SCRIPT}.yml" \
              '.workflows[] | select(.path==$path) | .id')

          if [ -z "$WORKFLOW" ]; then
            echo "Error: Workflow ${SCRIPT}.yml not found"
            exit 1
          fi

          # Most recent run (sorted by created, descending).
          RUN_DATA=$(gh api "/repos/${{ github.repository }}/actions/workflows/${WORKFLOW}/runs?per_page=1" \
            | jq '.workflow_runs[0] | {id: .id, conclusion: .conclusion, attempt: .run_attempt}')

          ID=$(echo "$RUN_DATA" | jq -r '.id')
          STATUS=$(echo "$RUN_DATA" | jq -r '.conclusion')
          ATTEMPT=$(echo "$RUN_DATA" | jq -r '.attempt')

          if [ -z "$ID" ] || [ "$ID" == "null" ]; then
            echo "No workflow runs found for ${SCRIPT}.yml"
            exit 0
          fi

          # Rerun only when the latest run failed AND we still have
          # retries left. Successful / cancelled / queued / running
          # runs are left alone.
          if [ "${ATTEMPT}" -lt "${ATTEMPTS}" ] && [ "$STATUS" == "failure" ]; then
            echo "Rerunning failed jobs for ${SCRIPT}.yml (attempt ${ATTEMPT}/${ATTEMPTS}, status: ${STATUS})"
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${{ github.repository }}/actions/runs/${ID}/rerun-failed-jobs"
          else
            echo "No rerun needed for ${SCRIPT}.yml (attempt ${ATTEMPT}/${ATTEMPTS}, status: ${STATUS})"
          fi
